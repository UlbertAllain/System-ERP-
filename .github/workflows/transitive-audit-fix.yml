name: Safe Transitive Audit Fix

on:
  push:
    branches:
      - "refactor/ui-giant-components-batch"
    paths:
      - ".github/workflows/transitive-audit-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/ui-giant-components-batch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply safe audit fixes to lockfile
        run: npm audit fix --package-lock-only || true

      - name: Verify resolved lockfile
        run: npm ci

      - name: Report remaining audit findings
        run: npm audit --audit-level=moderate || true

      - name: Commit safe lockfile fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "security: apply safe transitive dependency fixes"
          git push origin HEAD:refactor/ui-giant-components-batch
