name: Legacy Alias Audit

on:
  push:
    branches:
      - "refactor/src-structure-standardization"
    paths:
      - ".github/workflows/legacy-alias-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find legacy feature aliases
        shell: bash
        run: |
          echo "=== LEGACY FEATURE ALIASES ==="
          git grep -n "@/features/" -- '*.ts' '*.tsx' '*.mjs' '*.js' || true
          echo "=== COUNT ==="
          git grep -l "@/features/" -- '*.ts' '*.tsx' '*.mjs' '*.js' | wc -l || true
