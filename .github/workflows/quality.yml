name: Quality Gate

on:
  push:
    branches:
      - main
      - "chore/**"
      - "refactor/**"
      - "perf/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const vulnerabilities = audit.vulnerabilities ?? {};
          const summary = Object.entries(vulnerabilities)
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              direct: Boolean(value.isDirect),
              range: value.range,
              fixAvailable: value.fixAvailable,
            }))
            .sort((a, b) => {
              const weight = { critical: 4, high: 3, moderate: 2, low: 1 };
              return (weight[b.severity] ?? 0) - (weight[a.severity] ?? 0);
            });

          console.log("Dependency vulnerability summary:");
          console.log(JSON.stringify(summary, null, 2));
          console.log("Metadata:");
          console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          NODE

      - name: Run quality gate
        run: npm run check
